# ROR Partnership Platform - Docker Compose
# For local development and Coolify deployment

version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ror-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - BUN_ENV=${BUN_ENV:-production}
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/ror_partnership}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-1h}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-7d}
      - API_URL=${API_URL}
      - APP_URL=${APP_URL}
      - MOBILE_APP_SCHEME=${MOBILE_APP_SCHEME:-rorpartnership}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - ESPEES_API_URL=${ESPEES_API_URL}
      - ESPEES_MERCHANT_ID=${ESPEES_MERCHANT_ID}
      - ESPEES_API_KEY=${ESPEES_API_KEY}
      - KINGCHAT_CLIENT_ID=${KINGCHAT_CLIENT_ID:-com.kingschat}
      - KINGCHAT_CLIENT_SECRET=${KINGCHAT_CLIENT_SECRET}
      - KINGCHAT_CALLBACK_URL=${KINGCHAT_CALLBACK_URL}
      - KINGCHAT_API_URL=${KINGCHAT_API_URL:-https://connect.kingsch.at/api/profile}
    depends_on:
      - mongo
      - redis
    networks:
      - ror-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: ror-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=ror_partnership
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - ror-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ror-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ror-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  ror-network:
    driver: bridge
